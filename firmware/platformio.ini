[platformio]
default_envs = waveshare_esp32_c6_lcd_1_47

[env:waveshare_esp32_c6_lcd_1_47]
; Official PlatformIO ships Arduino core 2.x, which marks ESP32-C6 as IDF-only.
; Pinned pioarduino supplies Arduino core 3.3.8 with supported C6 builds.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D CORE_DEBUG_LEVEL=1
lib_deps =
  moononournation/GFX Library for Arduino@1.6.7
  bblanchon/ArduinoJson@7.4.3
  adafruit/Adafruit NeoPixel@1.15.5
  adafruit/Adafruit GFX Library@1.12.6
